version = 1

[[annotations]]
path = [
    "media/.htaccess",
    "media/images/**",
    "weechat/**/_i18n_*.py",
    "weechat/**/migrations/*.py",
    "weechat/fixtures/*.json",
    "weechat/templates/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2003-2026 Sébastien Helleu <flashcode@flashtux.org>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "uv.lock"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sébastien Helleu <flashcode@flashtux.org>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
    "media/css/bootstrap*.css",
    "media/js/bootstrap*.js",
]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "media/js/jquery*.js",
]
precedence = "override"
SPDX-FileCopyrightText = "OpenJS Foundation and other contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "media/pgp/*",
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "weechat/common/cvss/__init__.py",
    "weechat/common/cvss/constants3.py",
    "weechat/common/cvss/cvss3.py",
    "weechat/common/cvss/exceptions.py",
]
precedence = "override"
SPDX-FileCopyrightText = "2016 Red Hat, Inc."
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = [
    "weechat/common/cvss/constants4.py",
    "weechat/common/cvss/cvss4.py",
]
precedence = "override"
SPDX-FileCopyrightText = "2023 FIRST.ORG, Inc., Red Hat, and contributors"
SPDX-License-Identifier = "BSD-2-Clause"
